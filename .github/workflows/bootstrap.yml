name: Bootstrap Cloud-Fuzzer source and verify tests
on:
  push:
    branches: [main]
    paths:
      - bundle/source.tar.gz
      - .github/workflows/bootstrap.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract source (archived from locally tested files)
        run: |
          test -s bundle/source.tar.gz
          tar -tzf bundle/source.tar.gz | head -30
          tar -xzf bundle/source.tar.gz
      - name: Run source syntax checks and DB/MCP integration tests
        run: |
          npm run check
          npm test
      - name: Commit readable source files and remove bootstrap archive
        run: |
          rm -f bundle/source.tar.gz .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: Cloudflare R2 D1 screenshot queue and authenticated MCP'
          git push origin HEAD:main
